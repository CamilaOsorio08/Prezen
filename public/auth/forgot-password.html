<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Institución Educativa Tulio Ospina</title>
    <!-- FontAwesome para los íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts para tipografías premium -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <!-- Decoraciones de fondo animadas -->
    <div class="bg-decorations">
        <div class="circle circle-bottom-left"></div>
        <div class="circle circle-right"></div>
        <div class="pattern pattern-book"><i class="fa-solid fa-book-open"></i></div>
        <div class="pattern pattern-pencil"><i class="fa-solid fa-pencil"></i></div>
        <div class="pattern pattern-shield"><i class="fa-solid fa-shield-halved"></i></div>
        <div id="particles-container"></div>
    </div>

    <!-- Contenedor Principal Glassmorphism -->
    <div class="login-container">
        <!-- Lado Izquierdo: Formulario -->
        <div class="login-form-side">
            <h2 class="title">Recuperar contraseña</h2>

            <p style="color: var(--text-gray); margin-bottom: 25px; line-height: 1.5; font-size: 0.95rem;">
                Ingresa tu correo electrónico registrado y te enviaremos las instrucciones para restablecer tu
                contraseña.
            </p>

            <form id="forgotPasswordForm">
                <div class="input-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="ejemplo@gmail.com" required>
                </div>

                <button type="submit" class="btn btn-signin" style="margin-top: 15px;">Enviar instrucciones</button>

                <div style="text-align: center; margin-top: 20px;">
                    <a href="index.html" class="forgot-link"
                        style="display: inline-flex; align-items: center; gap: 8px;">
                        <i class="fa-solid fa-arrow-left"></i> Volver al inicio de sesión
                    </a>
                </div>
            </form>
        </div>

        <!-- Lado Derecho: Branding Institucional -->
        <div class="login-brand-side">
            <h3 class="brand-subtitle">INSTITUCIÓN EDUCATIVA</h3>
            <h1 class="brand-title">TULIO OSPINA</h1>
            <div class="brand-logo">
                <img src="assets/image/escudo.png" alt="Escudo Institución Educativa Tulio Ospina" id="escudo-img">
            </div>
        </div>
    </div>

    <script src="assets/js/script.js"></script>
    <script>
        // Funcionalidad específica de demostración para el form de recuperar contraseña.
        const forgotForm = document.getElementById('forgotPasswordForm');
        if (forgotForm) {
            forgotForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const btn = forgotForm.querySelector('.btn-signin');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Enviando...';
                btn.style.opacity = '0.8';
                btn.disabled = true;

                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.opacity = '1';
                    btn.disabled = false;
                    alert('Se han enviado las instrucciones a tu correo electrónico.');
                }, 1500);
            });
        }
    </script>
</body>

</html>
